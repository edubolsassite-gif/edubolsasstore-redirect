/* Layout: um palco 16:9 (1920x1080) escalado para caber na largura, controles de reprodução abaixo. Visual único escuro, como a versão negativa da marca. */
:root{
  --ink:#000000;          /* Black da marca */
  --rose:#EDBAAF;         /* Pantone 7520 C */
  --paper:#FFFFFF;        /* logo negativa */
  --rose-dim:rgba(237,186,175,.8);
  --line:rgba(237,186,175,.28);
  --muted:#8f8582;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;  /* substituta da Akira Expanded */
  --f-text:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-text);padding-inline:16px;padding-block:24px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--ink);outline:1px solid #1c1a1a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink)}
.abs{position:absolute}
#content{position:absolute;inset:0;transform-origin:960px 540px}
#grain{position:absolute;inset:0;width:1920px;height:1080px;opacity:.085;mix-blend-mode:screen;pointer-events:none;image-rendering:pixelated}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.75) 100%);pointer-events:none}

/* Cena 1: líder de filme + ano */
#leader{position:absolute;left:0;top:0}
#year{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
.digits{position:absolute;left:50%;top:540px;display:flex;transform:translate(-50%,-50%)}
.col{width:206px;height:286px;overflow:hidden;position:relative}
.strip{position:absolute;left:0;top:0;width:100%;font-family:var(--f-display);font-weight:800;font-size:260px;line-height:286px;text-align:center;color:var(--paper);font-variant-numeric:tabular-nums}
.strip span{display:block;height:286px}
#desde{position:absolute;left:0;width:1920px;top:330px;text-align:center;font-family:var(--f-text);font-weight:500;font-size:44px;color:var(--rose);text-transform:uppercase;white-space:nowrap}
.corner{position:absolute;bottom:64px;font-family:var(--f-text);font-weight:600;font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--rose-dim)}
#cl{left:96px}#cr{right:96px}
#rule{position:absolute;left:96px;right:96px;bottom:112px;height:1px;background:var(--line);transform-origin:50% 50%}

/* Cena 2-4: quadro + EB + assinatura */
#logo{position:absolute;inset:0;transform-origin:960px 540px}
#under{position:absolute;left:0;top:0;transform-origin:0 0}
#frame{position:absolute;left:0;top:0;overflow:visible}
#frame path{fill:none;stroke:var(--paper);stroke-width:30;stroke-linecap:square;stroke-linejoin:miter}
#glintBox{position:absolute;left:760px;top:340px;width:400px;height:400px;overflow:hidden}
#glint{position:absolute;top:-200px;left:0;width:90px;height:800px;background:linear-gradient(90deg,transparent,rgba(237,186,175,.55),transparent);transform-origin:50% 50%}

#tag{position:absolute;left:0;width:1920px;top:764px;text-align:center;font-family:var(--f-text);font-weight:500;font-size:30px;color:var(--rose);white-space:nowrap;text-transform:uppercase}

/* Controles */

.bar button{font:600 14px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;background:var(--rose);color:var(--ink);border:0;padding:12px 18px;cursor:pointer}
.bar button:focus-visible,#scrub:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

<div class="wrap">
  <div class="viewport" id="vp">
    <div id="stage" aria-label="Abertura animada Edubolsas, desde 1967" role="img">
      <div id="content">
        <svg id="leader" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
          <line id="lh" x1="0" y1="540" x2="1920" y2="540" stroke="#EDBAAF" stroke-opacity=".3" stroke-width="1.5"/>
          <line id="lv" x1="960" y1="0" x2="960" y2="1080" stroke="#EDBAAF" stroke-opacity=".3" stroke-width="1.5"/>
          <path id="wedge" fill="#EDBAAF" fill-opacity=".1"/>
          <circle id="ring1" cx="960" cy="540" r="330" fill="none" stroke="#EDBAAF" stroke-width="2.5"/>
          <circle id="ring2" cx="960" cy="540" r="380" fill="none" stroke="#EDBAAF" stroke-opacity=".45" stroke-width="1.5"/>
        </svg>

        <div id="year">
          <div id="desde">Desde</div>
          <div class="digits" id="digits"></div>
        </div>

        <div id="logo">
          <div id="under"></div>
          <svg id="frame" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
            <path id="fl" d="M745 755 L745 325 L960 325"/>
            <path id="fr" d="M1175 755 L1175 325 L960 325"/>
          </svg>
          <div id="glintBox"><div id="glint"></div></div>
          <div id="eb"></div>
        </div>
        <div id="word"><div id="shine"></div></div>
        <div id="tag">Desde 1967</div>

        <div id="rule"></div>
        <div class="corner" id="cl">Sessenta anos</div>
        <div class="corner" id="cr">Couro legítimo</div>
      </div>
      <canvas id="grain" width="480" height="270"></canvas>
      <div id="vignette"></div>
    </div>
  </div>

  <div class="bar">
    <button id="play" type="button">Reproduzir</button>
    <input id="scrub" type="range" min="0" max="6000" step="1" value="0" aria-label="Posição na animação">
    <span id="clock">0,0 s / 6,0 s</span>
  </div>
  <p class="note">Abertura de 6 segundos em 1920×1080. O ano 1967 gira como um contador de filme, a linha rosé vira o quadro da marca, o monograma EB aparece e a assinatura EDUBOLSAS sobe letra por letra.</p>
</div>

<script>
(function(){
const D=6;
const $=id=>document.getElementById(id);
const clamp=x=>x<0?0:x>1?1:x, lerp=(a,b,x)=>a+(b-a)*x, P=(t,a,b)=>clamp((t-a)/(b-a));
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x), inCubic=x=>x*x*x, outCubic=x=>1-Math.pow(1-x,3);
const inOutQuint=x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2, outSine=x=>Math.sin(x*Math.PI/2);
const outBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
// rampa de velocidade: rápido, desacelera no meio, acelera de novo
const ramp=x=>x<.5?.5*outCubic(2*x):.5+.5*inCubic(2*x-1);

// dígitos estilo contador
const TARGET=[1,9,6,7], H=286;
const cols=TARGET.map((d,i)=>{
  const c=document.createElement('div');c.className='col';
  const s=document.createElement('div');s.className='strip';
  const n=10+d+1;let html='';for(let k=0;k<n;k++)html+='<span>'+(k%10)+'</span>';
  s.innerHTML=html;c.appendChild(s);$('digits').appendChild(c);
  return {c,s,steps:n-1,start:.12+i*.09,dur:1.05+i*.06};
});

// fatias das letras da assinatura (limites medidos na logo oficial)
const B=[0,78,166,261,351,458,539,620,721,798], K=900/798;
const slices=[];
for(let i=0;i<9;i++){
  const s=document.createElement('div');s.className='slice';
  const x=B[i]*K,w=(B[i+1]-B[i])*K;
  s.style.left=x+'px';s.style.width=w+'px';
  const g=document.createElement('i');g.style.left=(-x)+'px';g.style.width='900px';
  g.style.webkitMaskPosition='0 0';g.style.maskPosition='0 0';
  s.appendChild(g);$('word').insertBefore(s,$('shine'));slices.push(g);
}

// grão de película, determinístico por quadro (24 q/s)
const gc=$('grain').getContext('2d'), gimg=gc.createImageData(480,270);
let lastG=-1;
function grain(t){
  const f=Math.floor(t*24);if(f===lastG)return;lastG=f;
  let s=(f*2654435761)>>>0||1;const d=gimg.data;
  for(let i=0;i<d.length;i+=4){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;const v=s&255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
  gc.putImageData(gimg,0,0);
}
function rnd(n){let s=(n*374761393+668265263)>>>0;s=(s^(s>>>13))*1274126177>>>0;return ((s^(s>>>16))>>>0)/4294967295}

function wedgePath(a){
  if(a<=0)return '';
  if(a>=360)a=359.99;
  const r=330,cx=960,cy=540,rad=(a-90)*Math.PI/180;
  const x=cx+r*Math.cos(rad),y=cy+r*Math.sin(rad);
  return `M${cx} ${cy} L${cx} ${cy-r} A${r} ${r} 0 ${a>180?1:0} 1 ${x} ${y} Z`;
}

function render(t){
  t=Math.max(0,Math.min(D,t));
  grain(t);

  // tremor de projetor nos primeiros segundos (referência à película de 1967)
  const f=Math.floor(t*24), weave=(1-P(t,1.6,2.4));
  const wx=(rnd(f)-.5)*2.4*weave, wy=(rnd(f+99)-.5)*2.4*weave;
  const push=1+.035*outSine(P(t,4.4,6));
  $('content').style.transform=`translate(${wx}px,${wy}px) scale(${push})`;

  // líder
  const lp=P(t,0,.95), lo=1-P(t,.95,1.45);
  $('wedge').setAttribute('d',wedgePath(360*ramp(lp)));
  const rs=lerp(.6,1,outExpo(P(t,0,.6)))+.5*inCubic(P(t,.95,1.45));
  ['ring1','ring2'].forEach((id,i)=>{const r=$(id);r.setAttribute('transform',`translate(960 540) scale(${rs*(1+i*.04*Math.sin(t*6))}) translate(-960 -540)`);});
  $('leader').style.opacity=lo;
  const lw=outExpo(P(t,0,.7));
  $('lh').setAttribute('x1',960-960*lw);$('lh').setAttribute('x2',960+960*lw);
  $('lv').setAttribute('y1',540-540*lw);$('lv').setAttribute('y2',540+540*lw);

  // ano rolando, depois colapsa no centro
  const yIn=P(t,.08,.3), ys=lerp(1.14,1,outCubic(P(t,.1,1.7)));
  $('year').style.transform=`scale(${ys})`;
  const col=P(t,2.15,2.6);
  cols.forEach((c,i)=>{
    const p=P(t,c.start,c.start+c.dur), e=outExpo(p);
    const pe=outExpo(P(t+.016,c.start,c.start+c.dur));
    const vel=Math.abs(pe-e)*c.steps*H;          // px por quadro
    c.s.style.transform=`translateY(${-e*c.steps*H}px)`;
    c.s.style.filter=vel>2?`blur(${Math.min(7,vel/14).toFixed(2)}px)`:'none';
    const off=(i-1.5)*206, ci=inCubic(clamp((col-i*.06)/(1-.18)));
    c.c.style.transform=`translateX(${-off*ci}px) scale(${1-ci*.7})`;
    c.c.style.opacity=yIn*(1-ci);
  });
  // DESDE: tracking fecha e depois sobe
  const dp=outCubic(P(t,1.15,1.9)), dOut=P(t,2.1,2.5);
  const de=$('desde');
  de.style.letterSpacing=lerp(2.4,.62,dp)+'em';
  de.style.opacity=dp*(1-dOut);
  de.style.transform=`translateY(${lerp(26,0,dp)-40*inCubic(dOut)}px)`;

  // linha rosé que vira a base do quadro
  const uIn=ramp(P(t,1.3,2.05)), m=inOutQuint(P(t,2.2,2.75));
  const uw=lerp(832*uIn,460,m), uh=lerp(4,30,m), ux=960-uw/2, uy=lerp(718,740,m);
  const u=$('under');
  u.style.width=uw+'px';u.style.height=uh+'px';u.style.transform=`translate(${ux}px,${uy}px)`;
  const cr=Math.round(lerp(237,255,m)),cg=Math.round(lerp(186,255,m)),cb=Math.round(lerp(175,255,m));
  u.style.background=`rgb(${cr},${cg},${cb})`;
  u.style.opacity=uIn>0?1:0;

  // quadro desenhado com rampa de velocidade
  const fp=ramp(P(t,2.7,3.35)), L=645;
  ['fl','fr'].forEach(id=>{const p=$(id);p.style.strokeDasharray=`${L*fp} ${L+40}`;p.style.opacity=fp>0?1:0;});

  // monograma EB
  const ep=P(t,3.05,3.75), eo=outExpo(ep), eb=$('eb');
  eb.style.clipPath=`inset(${(1-eo)*100}% 0 0 0)`;
  eb.style.transform=`translateY(${lerp(28,0,eo)}px) scale(${lerp(.9,1,outBack(clamp(ep*1.15)))})`;
  eb.style.opacity=ep>0?1:0;
  const gp=P(t,3.35,3.95);
  $('glint').style.transform=`translateX(${lerp(-160,520,inOutQuint(gp))}px) rotate(18deg)`;
  $('glint').style.opacity=gp>0&&gp<1?1:0;

  // quadro + EB sobem e reduzem (lento-rápido-lento)
  const lg=inOutQuint(P(t,3.85,4.6));
  $('logo').style.transform=`translateY(${lerp(0,-150,lg)}px) scale(${lerp(1,.62,lg)})`;

  // assinatura letra a letra
  slices.forEach((g,i)=>{
    const p=P(t,4.22+i*.045,4.22+i*.045+.6), e=outExpo(p);
    g.style.transform=`translateY(${(1-e)*118}%)`;
  });
  const sp=P(t,5.15,5.85);
  $('shine').style.backgroundPosition=`${lerp(110,-10,inOutQuint(sp))}% 0`;
  $('shine').style.opacity=sp>0&&sp<1?1:0;

  const tp=outCubic(P(t,4.7,5.5)), tag=$('tag');
  tag.style.letterSpacing=lerp(1.5,.7,tp)+'em';tag.style.opacity=tp;
  tag.style.transform=`translateY(${lerp(16,0,tp)}px)`;

  // rodapé
  const cp=outCubic(P(t,1.5,2.2));
  $('rule').style.transform=`scaleX(${cp})`;
  ['cl','cr'].forEach((id,i)=>{const el=$(id);el.style.opacity=cp;el.style.transform=`translateX(${(i?1:-1)*lerp(30,0,cp)}px)`;});

  $('scrub').value=Math.round(t*1000);
  $('clock').textContent=t.toFixed(1).replace('.',',')+' s / 6,0 s';
}

// escala do palco
const vp=$('vp'), stage=$('stage');
function fit(){stage.style.transform=`scale(${vp.clientWidth/1920})`}
new ResizeObserver(fit).observe(vp);fit();

// reprodução
let playing=false,t0=0,from=0,cur=0;
function tick(now){if(!playing)return;cur=from+(now-t0)/1000;if(cur>=D){cur=D;playing=false;$('play').textContent='Reproduzir'}render(cur);if(playing)requestAnimationFrame(tick)}
function play(){if(cur>=D)cur=0;from=cur;t0=performance.now();playing=true;$('play').textContent='Pausar';requestAnimationFrame(tick)}
$('play').addEventListener('click',()=>{if(playing){playing=false;$('play').textContent='Reproduzir'}else play()});
$('scrub').addEventListener('input',e=>{playing=false;$('play').textContent='Reproduzir';cur=e.target.value/1000;render(cur)});

window.__seek=t=>render(t);
let capturing=false;
window.__capture=()=>{capturing=true;document.body.classList.add('capture');playing=false;fit()};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const start=()=>{if(reduce){cur=D;render(D)}else{render(0);setTimeout(()=>{if(!capturing)play()},350)}};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
render(D);
})();
</script>
